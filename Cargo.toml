[package]
name = "uadl"
version = "0.1.0"
edition = "2021"
description = "Download an Unacademy class as a single MP4 with the whiteboard rendered in"
license = "MIT"
[lib]
name = "uadl"
crate-type = ["cdylib", "rlib"]
[[bin]]
name = "uadl"
path = "src/main.rs"
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png"] }
rayon = "1"
sha1_smol = "1"
once_cell = "1"
[profile.release]
lto = true
codegen-units = 1
strip = true
